# Where a run's wall clock goes: `uv run main.py +experiment=... trainer=profile`.
#
# Inherits the default trainer rather than restating it, so a profiling run
# measures the settings a real run trains with — precision above all. A preset
# that copies its neighbour drifts from it, and then it profiles a program
# nobody runs.
#
# `simple` times Lightning's own hooks, which answers the question worth asking
# first: data fetch (`run_training_epoch` minus the rest), forward
# (`training_step`), `backward`, `optimizer_step`. Swap to `advanced` for a
# cProfile breakdown per hook, or `pytorch` for per-operator detail:
#
#   uv run main.py +experiment=... trainer=profile trainer.profiler.name=pytorch
#
# The report is written into the run's directory as `fit-profile.txt` — see
# docs/guides/logging.md for what the numbers do and do not include.
defaults:
  - default

profiler:
  name: simple
  # Both keys, because `filename` is a switch rather than a name: a profiler writes
  # a file only when it has the two, and with a directory alone the report still
  # goes to the job log — three hundred lines of it, in a column padded out to the
  # widest action name. Lightning prefixes the stage, so this is `fit-profile.txt`.
  dirpath: ${run.directory}
  filename: profile
