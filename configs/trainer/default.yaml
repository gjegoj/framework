accelerator: auto
devices: auto
# precision: bf16-mixed
log_every_n_steps: 10
num_sanity_val_steps: 0
deterministic: warn
# Off by default; `trainer=profile` turns it on. Override the kind with the
# shorthand — `trainer=profile trainer.profiler=pytorch` — because dotting into a
# key that is null here (`trainer.profiler.name=...`) has nothing to dot into.
profiler: null
