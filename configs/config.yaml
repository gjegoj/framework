defaults:
  - hydra: default         # run directory follows run.project/run.name
  - model: resnet18
  - optimizer: adamw
  - scheduler: none        # swap to cosine / onecycle / plateau / step
  - trainer: default
  - preprocessing: image
  - transforms: default    # the deterministic pixel pipeline; swap to `augmented` to add train-time augmentation
  - loader: default
  - adapter: none          # `lora` holds a backbone still and learns a low-rank delta beside it
  - callbacks: none        # `default` keeps the best weights and logs the rate (it needs a tracker)
  - tracker: none          # nothing is recorded; swap to `csv` for a local file or `clearml` to upload
  - export: none           # nothing is shipped; swap to `onnx`, `pt2`, `torchscript` or `all`
                           # (`ncnn` and `tensorrt` need a converter this framework cannot depend on)
  - _self_
  # After `_self_` on purpose: an experiment overrides this file's own values (lr,
  # epochs, data), and the command line still overrides the experiment. Declared
  # here so runs say `experiment=examples/classification` — no `+`, like any group.
  - experiment: null

seed: 42
lr: 1.0e-3
epochs: 10
batch_size: 16

data:
  name: table
  source: ???
  inputs:
    image: {column: image}
  split: {train: 0.7, val: 0.15, test: 0.15}

tasks: {}

# `learner` and `teacher` are neither declared here nor groups, and cannot be: a run that learns from a
# second network names a file this machine holds, so no shipped file could carry one. Both go in an
# experiment, after an ordinary run has left a checkpoint to learn from:
#   learner: {name: distillation, temperature: 4.0, weight: 0.5}
#   teacher: {name: composite, backbone: {name: timm, model_name: resnet50, pretrained: true},
#             checkpoint_path: runs/<project>/<name>/checkpoints/<file>.ckpt}
# The teacher's heads are sized by this run's own tasks, so nothing about them is written twice.

run:
  project: my-project      # the run's identity: tracker project + the runs/ subtree
  name: ${now:%Y-%m-%d}/${now:%H-%M-%S}
  train: true
  test: true
  directory: ${hydra:run.dir}
  # `checkpoint_path` and `resume_path` are not declared here and arrive from the command line with
  # a `+`. Quote the value: every file the shipped saver writes carries `=` in its name, and Hydra
  # reads the first one as the end of the key —
  # `+run.checkpoint_path='"runs/pet/…/epoch=3-step=92.ckpt"'`, shell quotes around Hydra's own.
