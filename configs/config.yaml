defaults:
  - hydra: default         # run directory follows run.project/run.name
  - model: resnet18
  - adapters: none       # swap to `lora` to train a low-rank delta instead of the backbone
  - distillation: none     # swap to `kl` to train beside a frozen teacher
  - optimizer: adamw
  - scheduler: none        # swap to cosine / onecycle / plateau / step
  - trainer: default
  - preprocessing: image  # swap to `none` for already-tensor inputs
  - transforms: default    # the deterministic pixel pipeline; swap to `augmented` to add train-time augmentation
  - loader: default
  - callbacks: none        # swap to `default` for checkpointing + lr logging
  - tracker: csv           # swap to `clearml` for experiment tracking, `none` to record nothing
  - export: none           # swap to `torchscript` to write a deployment artifact
  - _self_
  # After `_self_` on purpose: an experiment overrides this file's own values (lr,
  # epochs, data), and the command line still overrides the experiment. Declared
  # here so runs say `experiment=examples/classification` — no `+`, like any group.
  - experiment: null

seed: 42
lr: 1.0e-3
epochs: 10
batch_size: 16

data:
  name: table
  source: ???
  inputs:
    image: {column: image}
  split: {train: 0.7, val: 0.15, test: 0.15}

tasks: {}

run:
  project: my-project      # the run's identity: tracker project + the runs/ subtree
  name: ${now:%Y-%m-%d}/${now:%H-%M-%S}
  train: true
  test: true
  directory: ${hydra:run.dir}
