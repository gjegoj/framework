# @package _global_
# ClearML experiment tracking; every Task.init knob forwards verbatim.
# The names default to the run's identity — override either right here.
#
# Tags are what the experiments list filters by, so they name the shape of a run
# rather than its results. The whole resolved config reaches ClearML as
# hyperparameters besides, so nothing has to be squeezed in here to be findable.
#
# Every chip is an interpolation, and one naming a section a run may not declare is
# reached through `oc.select`: an absent scheduler, neck, delta or distillation
# leaves an empty string, which the tracker drops, rather than ending the composition
# and the run with it. A name is reached the same way — a component written out by
# `_target_` writes none, here as everywhere — so such a run is filed under one chip
# fewer.
#
# The three carrying a prefix read values this file's own root always declares.
# Written around an optional one, a prefix would leave `lr=` standing: a chip that
# says nothing and is not empty either, so nothing drops it.
#
# The architecture is named by whichever key its family spells it with — `model_name`
# for timm and for a text family, `arch` with `encoder_name` for smp — each reached
# the same way, so the ones a run does not write leave blanks. A backbone under a
# wrapper spells it a level deeper and a tower carries a name the run itself chose,
# so a paired or multi-view run is filed under what it does write: naming those
# positions here would be this file guessing what a run called its parts.
#
# The picture's size is not a chip at all. It is declared per input, under a name each
# run chooses, and a run with two pictures has two of them — so there is no one key to
# read. It is in the hyperparameters meanwhile, like everything else not worth a chip.
tracker:
  name: clearml
  project_name: ${run.project}
  task_name: ${run.name}
  # Where a page drawn by `callbacks=samples` is uploaded. Left out, it goes to `api.files_server`,
  # and there is no other way to move it: `output_uri` is where models and artifacts go first, and an
  # artifact falls back to this one, but no key of clearml.conf reaches a debug sample. Credentials are
  # clearml.conf's, and a destination this run cannot write to is refused when the run is created
  # rather than at the epoch that first draws.
  #
  # If a run that draws pages records nothing at all — scalars included — this is the second thing to
  # suspect, not the first. Numbers and files do share one queue and one worker in the SDK, so an
  # upload that stalls holds every reading behind it; but measured 2026-09-14, the upload was not the
  # cause. On Linux the SDK reports from a subprocess (`sdk.development.report_use_subprocess`, on by
  # default), a container with a small /dev/shm wedges it the moment a file event is queued, and the
  # SDK's own recovery misses that: it catches a reporter that died, never one alive and stuck.
  # `report_use_subprocess: false` in clearml.conf brought that run back.
  # media_uri: s3://bucket/clearml-media

  # The files the model is in — the checkpoint the run ended holding (or, for a run that does not train,
  # the one `run.checkpoint_path` pointed it at) and every format `export` wrote, with what it cannot be
  # opened without — are kept as artifacts of the task, beside `model.json`. They go to the task's
  # `output_uri` — declared here, or set by `sdk.development.default_output_uri` in clearml.conf or by
  # the project's default — else to `media_uri`, else to the file server. ClearML's own capture of
  # PyTorch weights is off for this; it filed every epoch's checkpoint as a model.
  #
  # Narrow them by a suffix as `export` spells it — a checkpoint goes by its own file's, `ckpt` for one
  # Lightning wrote; a format above the limit stays on disk, named in a warning. Left out: every suffix,
  # one GiB.
  # keep_suffixes: [onnx, ckpt]
  # keep_max_gib: 1.0
  tags:
    - ${oc.select:model.backbone.name,''}          # the family the heads are built over: timm / smp / hf_text
    - ${oc.select:model.backbone.model_name,''}    # the network itself, as timm and a text family name it
    - ${oc.select:model.backbone.arch,''}          # as smp names the decoder around one
    - ${oc.select:model.backbone.encoder_name,''}  # and the encoder under that
    - ${oc.select:optimizer.name,''}
    - ${oc.select:scheduler.name,''}               # the section itself may be null

    - ${oc.select:model.neck.name,''}              # projector, where a run brings a stream to a width it chose
    - ${oc.select:adapter.name,''}                 # lora, where a run learns a delta beside weights held still
    - ${oc.select:learner.name,''}                 # distillation, where a second network teaches this one
    - lr=${lr}
    - bs=${batch_size}
    - epochs=${epochs}
