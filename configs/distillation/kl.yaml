# @package _global_
# Temperature-scaled KL against a frozen teacher.
#
# Each task's TRAINING loss gains the soft term below; validation and test are untouched,
# so their numbers stay comparable with an undistilled run's. The teacher runs under
# no_grad, never learns, and is not exported — the artifact is the student.
#
# The soft term is an ordinary loss declaration: its temperature and its weight live on
# it, exactly as a task's own loss terms carry theirs. `checkpoint_path` is optional:
# a backbone declared `pretrained: true` is already a teacher.
distillation:
  teachers:
    - model: {name: timm, model_name: resnet50, pretrained: false}
      checkpoint_path: ???      # a run's .ckpt holding the teacher's weights
  loss: {name: kl_divergence, temperature: 2.0, weight: 0.7}
