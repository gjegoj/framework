# @package _global_
# Train beside a frozen teacher: this run's tasks on another backbone (heads sized by the
# same facts as the student's), named so a loss component can address it.
# The soft term is an ordinary weighted loss entry.
distillation:
  teachers:
    mentor:
      model: {name: composite, backbone: {name: timm, model_name: resnet50, pretrained: false}}
      checkpoint_path: ???      # a run's .ckpt holding the teacher's weights
  loss:
    - loss: {name: kl_divergence, teacher: mentor, temperature: 2.0}
      weight: 0.7
