# @package _global_
# Keep the best weights and record the learning rate.
# Order matters: a callback that changes the weights belongs before one that saves them.
# `monitor` names a key the run logs: `val/loss` is the total, and every run has one.
# Per-task keys are `val/<task>/<metric>` and `val/<task>/<loss part>` — e.g. `val/label/accuracy`.
#
# `dirpath` is written on every saver, here and in your own experiments. Left out,
# Lightning resolves it from the *logger* — with a tracker that uploads rather than
# writes that is `runs/<project>/<name>/<name>/<task id>/checkpoints`, the run's
# identity spelled twice plus a hash, three levels below everything else it produced.
callbacks:
  - {name: lr_monitor, logging_interval: epoch}
  - {name: model_summary, max_depth: 3}
  - {name: dataset_summary}
  - {name: metric_summary}
  - {name: progress}
  - name: checkpoint
    monitor: val/loss
    mode: min
    save_top_k: 1
    save_weights_only: true
    dirpath: ${run.directory}/checkpoints
