# @package _global_
# Keep the best weights and record the learning rate.
# Order matters: a callback that changes the weights belongs before one that saves them.
# `monitor` names a key the run logs: `val/loss` is the total, and every run has one.
# `lr_monitor` needs somewhere to write: this group with `tracker: none` is refused by Lightning.
# Per-task keys are `val/<task>/<metric>` and `val/<task>/<loss term>` — e.g. `val/label/accuracy`.
#
# `dirpath` is written on every saver, here and in your own experiments. Left out,
# Lightning resolves it from the *tracker* — with one that uploads rather than writes
# that is the run's identity spelled twice plus a hash, three levels below everything
# else the run produced.
callbacks:
  - {name: lr_monitor, logging_interval: epoch}
  - name: checkpoint
    monitor: val/loss
    mode: min
    save_top_k: 1
    # Weights *and* the optimizer, the schedule and the epoch, because `run.resume_path` continues a
    # run from this very file and Lightning refuses a weights-only one for that.
    dirpath: ${run.directory}/checkpoints
