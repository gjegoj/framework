# @package _global_
# What a run gets unless it says otherwise: something to watch it by, and the weights kept.
# Order matters: a callback that changes the weights belongs before one that saves them.
#
# `progress` and `model_summary` stand in for Lightning's own bar and summary — declared here, they
# replace them rather than adding to them, because Lightning only adds a default where a run has none.
#
# `monitor` names a key the run logs: `val/loss` is the total, and nearly every run has one. A run whose
# objective is scored only while it is being learned — metric learning over identities held out of
# training — writes none, and is refused this by name at build, with the readings it does write.
# Per-task keys are `val/<task>/<metric>` and `val/<task>/<loss term>` — e.g. `val/label/accuracy`.
# `lr_monitor` needs somewhere to write: this group with `tracker: none` is refused by Lightning.
#
# `dirpath` is written on every saver, here and in your own experiments. Left out,
# Lightning resolves it from the *tracker* — with one that uploads rather than writes
# that is the run's identity spelled twice plus a hash, three levels below everything
# else the run produced.
callbacks:
  # The bar, with a table of every measurement under it: a row per measurement, a column per stage,
  # and the best each has reached. `metric_filters: [loss, f1]` narrows it when a run measures a lot.
  - {name: progress}
  # The model as the tree its module paths describe — the same paths `checkpoint` and freezing use.
  # Three deep, because the line worth reading is the backbone's parameter count against the heads'.
  # The `_measured` rows beside it are the metric state, one copy per stage so a validation epoch never
  # reads what a training one accumulated; they carry no parameters. `max_depth: 2` leaves them folded.
  - {name: model_summary, max_depth: 3}
  - {name: lr_monitor, logging_interval: epoch}
  # The final numbers, once, where a backend keeps a table for them; ClearML does, a CSV file does not.
  - {name: metric_summary}
  # Six more are declarable and none is a default. Four of them change what a run learns rather than
  # what it shows: `freeze` holds named parts of the model still and lets them go partway in,
  # `ema` averages the last stretch of weights and validates and saves in their place,
  # `batch_transform` mixes samples together while training (`transform: {_target_:
  # src.transforms.MixUp, alpha: 0.4}`), and `anneal` moves one number of a task's objective over the
  # run (`{name: anneal, task: label, parameter: focal.gamma, start: 0.0, end: 2.0}`).
  # `experiment=examples/finetuning` runs the first three.
  # The other two show rather than change, and are declared for a reason of their own. `samples` draws
  # a batch as a page of pictures — `callbacks=samples` is that set, and it needs a tracker that can
  # show one. `dataset_summary` prints each target's balance before the first epoch: free for a label
  # or a number, and a full read of the data for a mask, which is why a run asks for it.
  # A run declaring its own set writes the whole list: a Hydra group replaces a list, never appends.
  - name: checkpoint
    monitor: val/loss
    mode: min
    save_top_k: 1
    # Weights *and* the optimizer, the schedule and the epoch, because `run.resume_path` continues a
    # run from this very file and Lightning refuses a weights-only one for that.
    dirpath: ${run.directory}/checkpoints
