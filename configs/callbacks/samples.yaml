# @package _global_
# The default callbacks, plus a grid of samples in the tracker.
# Needs a logger that can show a page: `tracker=clearml`. Anything else warns once
# and draws nothing rather than failing the run.
# `mean`/`std` are the root's, by interpolation, quoted so YAML reads it as a string:
# the page has no default of its own, so a run that normalises differently changes one
# number at the root and the page follows, instead of quietly denormalising by something else.
callbacks:
  - {name: lr_monitor, logging_interval: epoch}
  - name: checkpoint
    monitor: val/loss
    mode: min
    save_top_k: 1
    save_weights_only: true
    dirpath: ${run.directory}/checkpoints
  - name: samples
    every_n_epochs: 5
    stages: [train, val, test]
    num_images: 8
    mean: ${preprocessing.inputs.image.mean}
    std: ${preprocessing.inputs.image.std}
