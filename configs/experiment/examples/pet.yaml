# @package _global_
# What every example on this page shares: the Oxford-IIIT Pet table and how to read it.
#
# Not runnable on its own — it declares no task, and a run without one is refused by
# name. The examples beside it inherit from it with `defaults: [pet]` and add the one
# thing each is about.
#
# The table comes from `scripts/prepare_pet.py`, or from `make test-run` which fetches it
# for you. Its columns:
#
#   image_path   the picture                          (the model's input)
#   species      cat / dog                            (global, 2 classes)
#   breed        one of 37                            (global, 37 classes)
#   mask_path    pet / background / boundary          (dense, 3 classes)
#   random_age   noise, by that name                  (global, continuous)
defaults:
  - override /transforms: augmented
  - override /callbacks: default
  # An example is meant to be run, so it records what it learned: a local file in the run
  # directory. The framework's own default is `tracker: none` — nothing is written unless a
  # run asks. `lr_monitor` needs one of these: a learning rate has nowhere to go otherwise.
  - override /tracker: csv

lr: 3.0e-4
epochs: 10
batch_size: 32

data:
  name: table
  source: data/pet/data.csv
  inputs:
    image: {column: image_path}
  # A rule of its own: stratified, so a rare class cannot land wholly in one stage. Leaving `rule`
  # out shuffles and cuts; `GroupedSplit` keeps every row of a patient or a scene on one side; and
  # a rule of your own arrives the same way, by import path. The paths inside the table are
  # absolute, so the image encoder needs no `root` of its own.
  split:
    train: 0.7
    val: 0.15
    test: 0.15
    rule: {_target_: src.data.StratifiedSplit, by: species}

run:
  project: pet
