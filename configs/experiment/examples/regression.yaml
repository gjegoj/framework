# @package _global_
# A continuous target: `uv run main.py experiment=examples/regression`.
#
# **`random_age` is noise, and named so nobody reads it as learnable.** Nothing in the
# picture carries it, so no model can beat predicting its middle. A `val/age/mae` that
# settles near **3.6 years** is the correct outcome, not a failure: the column is uniform
# over 0.5–15, and a constant at its middle is off by a quarter of that range. (Its
# standard deviation, 4.2, is the other summary of the same spread and is not what a mean
# absolute error measures — reading 3.6 as "better than possible" sends you hunting a leak) — what this example demonstrates is that a regression task *builds,
# trains, logs and reports*, which is a property of the pipeline rather than of a model.
#
# Swap `target_column` for a column that carries signal and nothing else here changes.
defaults:
  - examples/pet
  - override /model: resnet18

tasks:
  age:
    kind: regression
    target_column: random_age
    # The default metric is mae; the objective defaults to mse. A second metric is a second entry, keyed by the
    # label it logs under, so `val/age/mae` and `val/age/mse` stand side by side.
    metrics:
      mae: {name: mae}
      mse: {name: mse}

# A continuous target can instead be learned as a distribution over bins, without
# leaving the regression semantics — choosing the encoder is the whole change:
#
#   target_encoder: {name: gaussian_bins, bins: 20}
#
# The bins then size the head, cross-entropy plus an expectation term replace mean
# squared error, and predictions are read back as a number so `mae` still applies.
