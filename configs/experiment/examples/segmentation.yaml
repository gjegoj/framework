# @package _global_
# Pet, background, boundary — per pixel: `uv run main.py experiment=examples/segmentation`.
#
# A dense task reads the decoder stream and takes smp's own segmentation head, so the
# output is full image size and nothing here writes a width.
defaults:
  - examples/pet
  - override /model: unet

# Masks are augmented jointly with their image — one crop, one flip, applied to both —
# because the transform is handed the whole sample. Nothing declares that here: the
# schema knows each target's geometry from the encoder that reads them.
preprocessing: {inputs: {image: {image_size: [256, 256]}}}
batch_size: 16

tasks:
  mask:
    kind: segmentation
    target_column: mask_path
    # The vocabulary is the one thing a mask cannot infer: a split that never shows a
    # class would silently shrink the index map. The encoder itself follows from the
    # dense shape, so nothing here names one.
    classes: {0: pet, 1: background, 2: boundary}
    head: native
    # The preset brings iou beside the classification set. Dice is the usual companion
    # for an imbalanced mask, and it goes in the loss rather than the metrics:
    # Several losses on one output: each entry names its loss apart from its weight, so a
    # loss's own `weight` argument (class weights) never collides with the mixing weight.
    loss:
      - {loss: cross_entropy, weight: 1.0}
      - {loss: dice, weight: 1.0}
