# @package _global_
# Minimal offline detection smoke: YOLO-format dataset, 2 epochs, CPU.
# Point data.sources at a YOLO dataset descriptor (data.yaml with path/train/val/names).
# Run: python main.py +experiment=detect_smoke
defaults:
  - override /trainer: cpu_smoke
  - override /logger: clearml

project: smoke-detection
seed: 0
epochs: 10
batch_size: 4
image_size: [64, 64]
run_export: false # detection export is phase 2 — the preconditions guard rejects it

data:
  sources: data/detect_smoke/data.yaml # YOLO descriptor: path / train / val / names

tasks:
  boxes:
    preset: detection
    model: yolov8n.yaml # ultralytics architecture yaml (offline) or .pt weights path
    # hyperparameters: {box: 7.5, cls: 0.5, dfl: 1.5, mosaic: 0.0}  # ultralytics hyp overrides
