# @package _global_
# A moderate baseline for natural-image classification: `transforms=augmented`.
# Train varies geometry, colour and image quality; evaluation keeps the deterministic tail alone.
# Flip/crop/colour changes assume the class survives them: tune these for text, orientation labels,
# small defects or tasks where colour is the label. Masks follow geometry with nearest interpolation.
# `RandomResizedCrop` already sizes the picture, so no `Resize` follows it.
# Parameters use the installed AlbumentationsX 2.3.7 API (`std_range`, `blur_range`, `*_range`).
#
# Two augmentations here answer a task instead of leaving its answer alone, which is how a folder of
# unannotated pictures becomes one. Each names the task it answers, and one pipeline carries one of
# them — albumentations routes a value by its kind, so a second would rewrite the first one's target:
#
#   - {_target_: src.transforms.Rotate90, task: turn}
#   - {_target_: src.transforms.RandomBorderCrop, task: trimmed, crop_left: 0.3, crop_right: 0.3,
#      min_crop: 0.15, applied_label: cropped, p: 0.5}
#
# The task's own `target_column` holds the picture's *current* state, upright or uncropped, because
# these advance it rather than set it — so a dataset that already records some of it stays truthful.
# What the column cannot teach is the rest of the vocabulary, so the task declares it: `classes:
# {0: "0", 1: "1", 2: "2", 3: "3"}` for the turn, `{0: intact, 1: cropped}` for the crop.
# `applied_label` is written as the table writes it, since encoding runs after the transforms.
# Both change the picture's size, so they go before the `Resize` that restores it — as below.
# Declare them on evaluation too, or its answers stay the column's and there is nothing to measure.
#
# A stage that draws needs `seed`. Measured on albumentationsx 2.3.7: a pipeline keeps a generator of
# its own, which seeding `random`, numpy and torch never reaches — so on the shipped loader
# (`num_workers: 0`) a run repeated at one seed trained on different pictures every time, val loss
# 0.6146 against 0.6207 from one declaration. With workers the library derives its working seed from
# this one and torch's per-worker seed, so each worker draws a stream of its own; there the line is
# what makes a run repeat by its own seed rather than by Lightning's worker seeding alone.
# The evaluation chain below draws nothing and needs none.
transforms:
  train:
    _target_: src.transforms.AlbumentationsTransform
    seed: ${seed}
    transforms:
      - _target_: albumentations.RandomResizedCrop
        size: "${preprocessing.inputs.image.image_size}"
        scale: [0.8, 1.0]
        ratio: [0.9, 1.1]
      - {_target_: albumentations.HorizontalFlip, p: 0.5}
      # One resampling for shift, scale and rotation. Reflected borders avoid a fixed black frame.
      - _target_: albumentations.Affine
        scale: [0.9, 1.1]
        translate_percent: {x: [-0.05, 0.05], y: [-0.05, 0.05]}
        rotate: [-15, 15]
        keep_ratio: true
        border_mode: 4  # cv2.BORDER_REFLECT_101
        p: 0.5
      - _target_: albumentations.ColorJitter
        brightness_range: [0.85, 1.15]
        contrast_range: [0.85, 1.15]
        saturation_range: [0.9, 1.1]
        hue_range: [-0.02, 0.02]
        p: 0.4
      # At most one blur per image; child probabilities are weights within OneOf.
      - _target_: albumentations.OneOf
        p: 0.2
        transforms:
          - {_target_: albumentations.GaussianBlur, blur_range: [3, 5], sigma_range: [0.2, 1.0], p: 0.75}
          - {_target_: albumentations.MotionBlur, blur_range: [3, 5], allow_shifted: false, p: 0.25}
      # Noise follows blur, at the final resolution. Gaussian std is a fraction of the pixel range.
      - _target_: albumentations.OneOf
        p: 0.2
        transforms:
          - {_target_: albumentations.GaussNoise, std_range: [0.01, 0.04], per_channel: true, p: 0.75}
          - _target_: albumentations.MultiplicativeNoise
            multiplier: [0.97, 1.03]
            per_channel: true
            elementwise: true
            p: 0.25
      - {_target_: albumentations.Normalize, mean: "${preprocessing.inputs.image.mean}", std: "${preprocessing.inputs.image.std}"}
      - {_target_: albumentations.pytorch.ToTensorV2}
  val: &evaluation
    _target_: src.transforms.AlbumentationsTransform
    transforms:
      - {_target_: albumentations.Resize, height: "${preprocessing.inputs.image.image_size.0}", width: "${preprocessing.inputs.image.image_size.1}"}
      - {_target_: albumentations.Normalize, mean: "${preprocessing.inputs.image.mean}", std: "${preprocessing.inputs.image.std}"}
      - {_target_: albumentations.pytorch.ToTensorV2}
  test: *evaluation
