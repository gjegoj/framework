# Training adds geometry and colour; evaluation stays deterministic.
train:
  _target_: src.transforms.AlbumentationsTransform
  transforms:
    - {_target_: albumentations.RandomResizedCrop, size: "${image_size}", scale: [0.7, 1.0]}
    - {_target_: albumentations.HorizontalFlip, p: 0.5}
    - {_target_: albumentations.ColorJitter, p: 0.3}
    - {_target_: albumentations.Normalize, mean: "${mean}", std: "${std}"}
    - {_target_: albumentations.ToTensorV2}
val: &evaluation
  _target_: src.transforms.AlbumentationsTransform
  transforms:
    - {_target_: albumentations.Resize, height: "${image_size.0}", width: "${image_size.1}"}
    - {_target_: albumentations.Normalize, mean: "${mean}", std: "${std}"}
    - {_target_: albumentations.ToTensorV2}
test: *evaluation
