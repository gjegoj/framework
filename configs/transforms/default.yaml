# Resize + normalize + to-tensor. The pipeline ends in ToTensorV2 because the
# raw-to-tensor boundary is crossed exactly once — see the data layer docs.
train: &pipeline
  _target_: src.transforms.AlbumentationsTransform
  transforms:
    - {_target_: albumentations.Resize, height: "${image_size.0}", width: "${image_size.1}"}
    - {_target_: albumentations.Normalize, mean: "${mean}", std: "${std}"}
    - {_target_: albumentations.pytorch.ToTensorV2}
val: *pipeline
test: *pipeline
