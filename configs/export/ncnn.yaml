# @package _global_
# A graph for phones: `<name>.param` says what the network is, `<name>.bin` holds its weights, and
# neither half deploys alone. Converted by `pnnx` from a TorchScript graph this writes first, at one row:
# an ncnn graph has no batch axis. `pnnx` ships its converter as a binary per platform, and the macOS one
# (pnnx 20260526) needs macOS 15 — on an older Mac this refuses, naming the converter's own error.
# ncnn names its own blobs (`in0`, `out0`) rather than keeping this run's task names, so a deployment
# reads them from the `.param` and takes the outputs in the order the record lists them.
# `fp16` is what a phone is usually given an ncnn graph for; it is written out here because it is the
# only choice this format has. The TorchScript step it converts from can be declared under it the way
# `tensorrt.yaml` declares its ONNX one, and is left out because nothing about that step is a choice.
#
# The graph is read back and compared with the model on the machine that exports it, so that machine's
# ncnn has to compute correctly. Measured 2026-09-25: ncnn 1.0.20260526 on an x86 CPU with AVX-512 FP16
# answers noise for a graph that matches the model on ARM to 1e-7. There, `verify: false` ships the graph
# uncompared, says so in the log, and records its parity as null — check it where it will run instead.
export:
  - name: ncnn
    fp16: false
    # verify: false
