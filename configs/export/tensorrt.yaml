# @package _global_
# A serialized TensorRT engine in {run.directory}/export/, for Triton's `tensorrt_plan`.
#
# CUDA only, and built on the node that will serve it: an engine is specific to the GPU,
# the driver and the TensorRT version it was built against, so one built elsewhere will
# not load. `tensorrt` is deliberately not a declared dependency — NVIDIA publishes no
# macOS build, so it cannot be locked from every machine. Install it where the engine is
# built: `uv pip install tensorrt`.
#
# The profile is a batch range because the exported graph already pins channels and
# spatial size; fp16 comes with its own looser parity tolerance.
export:
  - name: tensorrt
    precision: fp16
    min_batch: 1
    opt_batch: 4
    max_batch: 8
