# @package _global_
# LoRA fine-tuning targeting ViT attention + MLP linears (DINOv3 / timm ViT naming).
#
# The backbone's base weights are frozen; only lora_* adapters and the task heads train.
# Checkpoints store TRAINABLE weights only (adapters + heads + criteria) — evaluating or
# resuming one requires the SAME backbone config (+ init_ckpt_path if one seeded the base).
# Export merges the adapters into the base weights: one plain artifact, no LoRA overhead.
#
# Freeze callback note: LoRA owns backbone freezing — a `freeze` callback targeting
# model.backbone is rejected at startup (it would freeze the adapters too).
lora:
  target_modules: [qkv, proj, fc1, fc2]
  rank: 8
  alpha: 16
  dropout: 0.0
  # extras forward to peft.LoraConfig verbatim, e.g.:
  # use_dora: true
  # use_rslora: true
