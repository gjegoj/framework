[project]
name = "framework"
version = "0.1.0"
description = "Config-driven multi-task training framework: thin core + capability packages"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "albumentationsx[headless]>=2.3.7",
    "clearml>=2.1.10",
    "faster-coco-eval>=1.7.2",
    "hydra-core>=1.3.4",
    "lightning>=2.6.5",
    "numkong==7.4.5",
    "onnx>=1.22.0",
    "onnxruntime>=1.28.0",
    "onnxscript>=0.7.1",
    "onnxsim>=0.7.0",
    "pandas>=3.0.5",
    "peft>=0.20.0",
    "plotly>=6.9.0",
    "pydantic>=2.13.4",
    "scikit-learn>=1.9.0",
    "scikit-multilearn>=0.2.0",
    "segmentation-models-pytorch>=0.5.0",
    "timm>=1.0.28",
    "transformers>=5.14.1",
    "ultralytics>=8.4.115",
]

[dependency-groups]
dev = [
    "huggingface-hub>=1.17.0",
    "ipykernel>=7.2.0",
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "e2e: full-flow integration (training smoke, export round-trip, full wiring); applied to tests/e2e/ by the root conftest",
    "slow: long-running tests excluded from the pre-commit gate",
]
filterwarnings = [
    # Known informational notices from Lightning on CPU smoke runs; not our defects.
    "ignore:GPU available but not used.*",
    "ignore:.*does not have many workers.*",
    "ignore:.*LeafSpec.*is deprecated.*",
    "ignore:Starting from v1.9.0, `tensorboardX` has been removed.*",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# ruff replaces black + isort + flake8: one formatter, one import order, one linter.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TRY", "RUF", "PL", "N"]
ignore = [
    "TRY003",  # long messages inline: our errors name the declaration and the fix
    "PLR2004", # magic numbers in tests and shape checks are the point
    "PLR0913", # constructors of composed objects take what they compose
    "PLC0415", # lazy imports are the quarantine: a library loads only when its adapter is selected
    "RUF001", "RUF002", "RUF003",  # prose in docstrings and messages may use typographic dashes
    "N812",    # `import albumentations as A` is that library's own spelling, as numpy is `np`
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0913", "PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]


[tool.typos.default.extend-words]
# ML abbreviations that typos misidentifies as misspellings
fpr = "fpr"
mis = "mis"
FPR = "FPR"
NCE = "NCE"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
